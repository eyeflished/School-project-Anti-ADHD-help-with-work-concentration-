<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Detector</title>
<style>
body{background:#111;color:#eee;font-family:sans-serif;text-align:center;padding:16px}
video{width:100%;max-width:480px;border-radius:8px;transform:scaleX(-1)}
#s{padding:6px 12px;border-radius:6px;background:#222;display:inline-block;margin:8px}
#s.a{background:#e74c3c;animation:p .5s infinite}
@keyframes p{50%{opacity:.5}}
button{padding:10px 18px;border:none;border-radius:6px;background:#2b6cb0;color:#fff;font-size:1em}
</style></head><body>
<div id="s">Нажми Старт</div><br>
<video id="v" autoplay playsinline muted></video><br>
<button id="b">Старт</button><div id="l"></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
<script>
const v=document.getElementById('v'),s=document.getElementById('s'),l=document.getElementById('l'),b=document.getElementById('b');
let m,run,ac,sn,seen=0;
function siren(){if(sn)return;ac=ac||new(AudioContext||webkitAudioContext)();
const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';g.gain.value=.15;
o.connect(g).connect(ac.destination);o.start();let f=500,d=1;
const i=setInterval(()=>{f+=d*40;if(f>900)d=-1;if(f<500)d=1;o.frequency.setValueAtTime(f,ac.currentTime)},30);
sn={o,i};}
function stop(){if(!sn)return;clearInterval(sn.i);sn.o.stop();sn=null;}
async function loop(){if(!run)return;
const p=await m.detect(v),ph=p.find(x=>x.class==='cell phone'&&x.score>.55);
if(ph){seen=Date.now();s.textContent='Телефон обнаружен';s.className='a';siren();}
else if(Date.now()-seen>1200){s.textContent='Телефон не обнаружен';s.className='';stop();}
l.textContent=p.map(x=>x.class).join(', ')||'нет объектов';
requestAnimationFrame(loop);}
b.onclick=async()=>{b.disabled=true;s.textContent='Запрос камеры...';
const st=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=st;
await new Promise(r=>v.onloadedmetadata=r);
s.textContent='Загрузка модели...';m=await cocoSsd.load();
run=true;s.textContent='Слежу...';loop();b.textContent='Работает';};
</script></body></html>
